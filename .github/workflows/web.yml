name: Loop Desktop

on:
  push:
    branches: [main]
    paths: ["Web/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["Web/**", ".github/workflows/web.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Static desktop checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check syntax, delimiters, and local assets
        working-directory: Web
        run: npm run check
